[package]
name = "phosphor-bridge"
version = "0.1.0"
edition = "2021"
description = "Hardware bridge for Phosphor — exposes Android/HAL to the browser over WebSocket"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# Web server (binds 127.0.0.1:7777, exposed only to the local browser)
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"

# HTTP client (used by the web.fetch method)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# DBus to talk to system services that aren't covered by Termux:API
zbus = { version = "4", default-features = false, features = ["tokio"] }
zbus_macros = "4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
anyhow = "1"
thiserror = "1"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

# CLI
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = "z"     # Size first — this binary ships on a phone
lto = true
codegen-units = 1
panic = "abort"
strip = true