name: build-ios
on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build + Test (Phosphor)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List available iOS Simulator devices (evidence)
        run: |
          echo "=== Full simulator list ==="
          xcrun simctl list devices available
          echo ""
          echo "=== iPhone 16 candidates ==="
          xcrun simctl list devices available | grep -i "iPhone 16" || echo "(no iPhone 16 devices listed)"

      - name: Resolve simulator destination
        id: sim
        run: |
          set -e
          for CANDIDATE in "iPhone 17" "iPhone 16" "iPhone 15" "iPhone 14"; do
            if xcrun simctl list devices available | grep -q "${CANDIDATE} ("; then
              echo "Picked simulator: ${CANDIDATE}"
              echo "sim_name=${CANDIDATE}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::No iPhone 14-17 simulator available. See 'List available iOS Simulator devices' step output."
          exit 1

      - name: Install xcodegen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          else
            echo "xcodegen already installed: $(xcodegen --version)"
          fi

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
        working-directory: ${{ github.workspace }}

      - name: Build + Test
        working-directory: ${{ github.workspace }}
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Phosphor.xcodeproj \
            -scheme Phosphor \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.sim_name }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Extract test results
        if: always()
        run: |
          echo "=== Test summary lines (last 200 of full log) ==="
          grep -E "Test Suite|Test Case|passed|failed|\*\* TEST" xcodebuild.log | tail -200 || true
          echo "=== Executed test cases (line items starting with -[) ==="
          grep -E "Test Case .* (passed|failed|skipped)" xcodebuild.log || true
          echo "=== Final 30 lines of build log ==="
          tail -30 xcodebuild.log

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: warn
          retention-days: 7

      - name: Locate the built .app
        id: findapp
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Phosphor.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            APP=$(find /Users/runner/Library/Developer/Xcode/DerivedData -name "Phosphor.app" -type d 2>/dev/null | head -1)
          fi
          echo "APP=$APP"
          echo "app_path=$APP" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned .app artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Phosphor-unsigned
          path: ${{ steps.findapp.outputs.app_path }}
          if-no-files-found: warn
          retention-days: 7

  # ── Checkpoint (b): sign + TestFlight upload ─────────────────────────────
  # Requires the seven repo secrets: IOS_CERTIFICATE_P12_BASE64,
  # IOS_CERTIFICATE_PASSWORD, PROVISIONING_PROFILE_BASE64, APPLE_TEAM_ID,
  # ASC_API_KEY_P8_B64, ASC_KEY_ID, ASC_ISSUER_ID.
  sign-testflight:
    name: Sign + TestFlight Upload
    needs: build-test
    if: github.ref == 'refs/heads/main'
    # macos-15 ships Xcode with the iOS 18.5 SDK — Apple rejects TestFlight
    # uploads not built with the iOS 26 SDK (ASC rejection). The
    # earlier "macos-26 pool died" diagnosis was wrong: that no-runner failure
    # was the Actions billing wall, since fixed by the PM. macos-26 = Xcode 26.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      APP_BUNDLE_ID: com.qsmtco.phosphor.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml

      - name: Stamp build number into Info.plist
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -e
          PLIST=ios/Phosphor/Info.plist
          BEFORE=$(grep -A1 '<key>CFBundleVersion</key>' "$PLIST" | tail -1 | tr -d '\t ')
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"
          AFTER=$(grep -A1 '<key>CFBundleVersion</key>' "$PLIST" | tail -1 | tr -d '\t ')
          echo "CFBundleVersion: $BEFORE -> $AFTER (run_number=$BUILD_NUMBER)"
          if [ "$AFTER" != "<string>$BUILD_NUMBER</string>" ]; then
            echo "::error::PlistBuddy stamp failed — CFBundleVersion is not $BUILD_NUMBER"
            exit 1
          fi

      - name: Import signing certificate
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -o pipefail
          {
            echo "=== cert-import diagnostics ==="
            if [ -z "$IOS_CERTIFICATE_P12_BASE64" ]; then
              echo "::error::Secret IOS_CERTIFICATE_P12_BASE64 is empty — see docs/ios-signing-setup.md §5 (exact names matter)"
              exit 1
            fi
            if [ -z "$IOS_CERTIFICATE_PASSWORD" ]; then
              echo "::error::Secret IOS_CERTIFICATE_PASSWORD is empty — see docs/ios-signing-setup.md §5"
              exit 1
            fi
            echo "secret length: ${#IOS_CERTIFICATE_P12_BASE64}"
            echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > cert.p12
            file cert.p12
            ls -la cert.p12
            openssl pkcs12 -in cert.p12 -passin env:IOS_CERTIFICATE_PASSWORD -noout 2>&1 && echo "PKCS12 PARSE OK" || echo "PKCS12 PARSE FAILED (password or file)"
            SECURITY_CREATE=$(mktemp -d)
            echo "SECURITY_CREATE=$SECURITY_CREATE" >> "$GITHUB_ENV"
            security create-keychain -p "$IOS_CERTIFICATE_PASSWORD" "$SECURITY_CREATE/build.keychain"
            security list-keychains -d user -s "$SECURITY_CREATE/build.keychain" $(security list-keychains -d user | tr '\n' ' ')
            security unlock-keychain -p "$IOS_CERTIFICATE_PASSWORD" "$SECURITY_CREATE/build.keychain"
            security import cert.p12 -k "$SECURITY_CREATE/build.keychain" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign 2>&1
            security set-key-partition-list -S apple-tool:,apple: -s -k "$IOS_CERTIFICATE_PASSWORD" "$SECURITY_CREATE/build.keychain" 2>&1
            rm cert.p12
            security find-identity -v -p codesigning
          } 2>&1 | tee cert-import.log

      - name: Write ASC API key
        env:
          ASC_API_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -z "$ASC_API_KEY_P8_B64" ]; then
            echo "::error::Secret ASC_API_KEY_P8_B64 is empty — see docs/ios-signing-setup.md §5"
            exit 1
          fi
          if [ -z "$ASC_KEY_ID" ]; then
            echo "::error::Secret ASC_KEY_ID is empty — see docs/ios-signing-setup.md §5"
            exit 1
          fi
          mkdir -p ~/private_keys
          echo "$ASC_API_KEY_P8_B64" | base64 --decode > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          ls -la ~/private_keys/

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$PROVISIONING_PROFILE_BASE64" ]; then
            echo "::error::Secret PROVISIONING_PROFILE_BASE64 is empty — note: NO IOS_ prefix on this one. See docs/ios-signing-setup.md §5"
            exit 1
          fi
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/phosphor-app-store.mobileprovision
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive (signed)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Secret APPLE_TEAM_ID is empty — see docs/ios-signing-setup.md §5"
            exit 1
          fi
          echo "Uploading build number: $BUILD_NUMBER (github.run_number — must exceed every previously uploaded CURRENT_PROJECT_VERSION)"
          xcodebuild \
            -project ios/Phosphor.xcodeproj \
            -scheme Phosphor \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Phosphor.xcarchive" \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            PROVISIONING_PROFILE_SPECIFIER="phosphor-app-store" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_ENTITLEMENTS=Phosphor/Phosphor.entitlements \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive 2>&1 | tee archive.log

      - name: Dump signed app entitlements (diagnostic)
        run: |
          set -eo pipefail
          # pipefail required: the SPEC-37 key gates below exit 1 inside the
          # braced group piped to tee — without pipefail, tee's exit 0 masks
          # the failure and the gate is cosmetic (SPEC-29-class bug, caught
          # in implementation audit).
          APP="$RUNNER_TEMP/Phosphor.xcarchive/Products/Applications/Phosphor.app"
          {
            echo "=== entitlements stamped into signed app (codesign) ==="
            codesign -d --entitlements :- "$APP" 2>&1 || codesign -d --entitlements - "$APP" 2>&1 || echo "(codesign dump failed)"
            echo ""
            echo "=== CODE_SIGN_ENTITLEMENTS in generated pbxproj ==="
            grep -n "CODE_SIGN_ENTITLEMENTS" apps/ios/Phosphor.xcodeproj/project.pbxproj || echo "!! CODE_SIGN_ENTITLEMENTS NOT FOUND IN PBXPROJ — xcodegen dropped it"
            echo ""
            echo "=== shipped Info.plist NFC keys ==="
            plutil -p "$APP/Info.plist" | grep -i "nfc\|RequiredDevice" || echo "!! no NFC keys in app Info.plist"
            echo "=== Phosphor Info.plist gate: camera + photo-library usage keys ==="
            # Hard assertions (not soft warnings): a missing key FAILS the
            # build. Missing NSCameraUsageDescription crashes the app on
            # iOS 26 the moment a photo input presents the camera.
            plutil -p "$APP/Info.plist" | grep -q "NFCReaderUsageDescription" || { echo "::error::missing NFCReaderUsageDescription in shipped Info.plist"; exit 1; }
            echo "NFC usage key present"
          } | tee entitlements-dump.txt

      - name: Export IPA
        run: |
          cat > ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.qsmtco.phosphor.app</key>
              <string>phosphor-app-store</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Phosphor.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" 2>&1 | tee export.log
          IPA_EXIT=${PIPESTATUS[0]}
          if [ "$IPA_EXIT" -ne 0 ] || [ ! -f "$RUNNER_TEMP/export/Phosphor.ipa" ]; then
            if [ "$IPA_EXIT" -ne 0 ]; then
              echo "::error::xcodebuild -exportArchive exited $IPA_EXIT — see export.log"
            else
              echo "::error::Export IPA produced no .ipa — see export.log"
            fi
            exit 1
          fi
          ls -la "$RUNNER_TEMP/export/"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          if [ -z "$ASC_ISSUER_ID" ]; then
            echo "::error::Secret ASC_ISSUER_ID is empty — see docs/ios-signing-setup.md §5"
            exit 1
          fi
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/Phosphor.ipa" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --verbose 2>&1 | tee upload.log

      - name: Upload signing logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signing-logs
          path: |
            archive.log
            export.log
            upload.log
            entitlements-dump.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$SECURITY_CREATE/build.keychain" || true
          rm -f ~/private_keys/*.p8
