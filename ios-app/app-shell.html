<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#1c1e2a" />
<title>Phosphor</title>
<style>
  :root {
    --bg-top: #242632; --bg-mid: #1c1d22; --bg-bottom: #1b1c21;
    --fg: #e8ecf4; --fg-dim: #6a7080; --accent: #7cffb2;
    --card: rgba(255,255,255,0.06); --line: rgba(255,255,255,0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 55%, var(--bg-bottom) 100%);
    color: var(--fg);
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── splash ─────────────────────────────────────────────────── */
  #splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 8px;
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 55%, var(--bg-bottom) 100%);
            transition: opacity 0.6s ease-out; }
  #splash.hide { opacity: 0; pointer-events: none; }
  .glyph-wrap { position: relative; width: 120px; height: 120px; }
  .glyph-glow { position: absolute; inset: -70px;
    background: radial-gradient(circle, rgba(232,236,244,0.28) 0%, rgba(232,236,244,0.08) 40%, transparent 70%);
    animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity:.75; transform:scale(1);} 50% { opacity:1; transform:scale(1.06);} }
  .wordmark { font-size: 44px; font-weight: 300; letter-spacing: .5px; color: #dfe4ee;
              text-shadow: 0 0 24px rgba(232,236,244,.25); }
  #boot-status { position: fixed; bottom: calc(env(safe-area-inset-bottom,0px) + 28px);
                 left:0; right:0; text-align:center; font-size:12px; letter-spacing:.18em; color:#6a7080; }
  .ring { display:inline-block; width:10px; height:10px;
    border:1.5px solid #3a3f4c; border-top-color:#9aa2b2; border-radius:50%;
    vertical-align:-1px; margin-right:8px; animation:spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── main app ───────────────────────────────────────────────── */
  #app { position: fixed; inset: 0; display: none; flex-direction: column; }
  #app.show { display: flex; }

  #screen {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 20px 16px calc(env(safe-area-inset-bottom, 0px) + 100px);
    scroll-behavior: smooth;
  }
  #screen > * { animation: fadein .25s ease-out; }
  @keyframes fadein { from { opacity:0; transform:translateY(6px);} to {opacity:1; transform:none;} }

  /* ── toolbar: [clear] [MIC] [settings] ──────────────────────── */
  #bar {
    position: fixed; left: 0; right: 0;
    bottom: 0;
    padding: 6px 18px calc(env(safe-area-inset-bottom, 0px) + 8px);
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(to top, rgba(27,28,33,0.98), rgba(27,28,33,0.85));
    border-top: 1px solid var(--line);
  }
  .bar-btn {
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--card); border: 1px solid var(--line);
    color: var(--fg-dim); font-size: 19px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .bar-btn:active { background: var(--card); color: var(--fg); }
  #mic {
    width: 48px; height: 48px; border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, var(--accent) 0%, rgba(124,255,178,0.85) 70%);
    border: none;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 24px rgba(124,255,178,0.45);
    cursor: pointer;
    transition: transform .15s ease;
  }
  #mic:active { transform: scale(0.94); }
  #mic.recording {
    background: radial-gradient(circle at 50% 40%, #ff5e7c 0%, rgba(255,94,124,0.85) 70%);
    box-shadow: 0 0 30px rgba(255,94,124,0.55);
    animation: micpulse 1.1s ease-in-out infinite;
  }
  @keyframes micpulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.08);} }
  #mic svg { width: 20px; height: 20px; }

  .thinking { display:flex; align-items:center; gap:8px; color:var(--fg-dim);
              font-size:13px; letter-spacing:.14em; padding: 6px 4px; }
  .thinking .dots span { animation: blink 1.2s infinite; display:inline-block; }
  .thinking .dots span:nth-child(2){ animation-delay:.2s; }
  .thinking .dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink { 0%,80%,100%{opacity:.2;} 40%{opacity:1;} }

  .err-card { background: rgba(255,94,124,.12); border:1px solid rgba(255,94,124,.4);
              border-radius:12px; padding:14px; color:#ff8ba0; font-size:14px; }
  .user-bubble { text-align:right; margin:10px 0; }
  .user-bubble span { background:rgba(124,255,178,.15); border:1px solid rgba(124,255,178,.3);
    border-radius:14px 14px 4px 14px; padding:9px 14px; display:inline-block; font-size:15px; }
  .voice-live { text-align:right; margin:10px 0; }
  .voice-live span { background:rgba(124,255,178,.08); border:1px dashed rgba(124,255,178,.4);
    border-radius:14px 14px 4px 14px; padding:9px 14px; display:inline-block; font-size:15px;
    color:#b8e8cd; font-style:italic; }
</style>
</head>
<body>

  <!-- SPLASH (approved brand image) -->
  <div id="splash">
    <img src="assets/splash-approved.jpg" alt="" style="position:absolute; inset:0;
         width:100%; height:100%; object-fit:cover;" />
  </div>
  <div id="boot-status"><span class="ring"></span>CONNECTING</div>

  <!-- MAIN APP -->
  <div id="app">
    <div id="screen"></div>
    <div id="bar">
      <button class="bar-btn" id="clear" title="clear session">⟲</button>
      <button id="mic" title="hold conversation via voice">
        <svg viewBox="0 0 24 24" fill="#06241a" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/>
          <path d="M18 11a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.91V19h-2a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.09A6 6 0 0 0 18 11z"/>
        </svg>
      </button>
      <button class="bar-btn" id="settings" title="settings">⚙</button>
    </div>
  </div>

<script>
/* ════════════════════════════════════════════════════════════════
   CONFIG — injected by the iOS userscript (PH_SERVER/PH_TOKEN) or
   localStorage on desktop.
   ════════════════════════════════════════════════════════════════ */
const CONFIG = {
  server: (typeof PH_SERVER !== 'undefined' && PH_SERVER) ||
          localStorage.getItem('ph:server') || 'http://127.0.0.1:8787',
  token:  (typeof PH_TOKEN !== 'undefined' && PH_TOKEN) ||
          (!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.phosphorApi) &&
           localStorage.getItem('ph:token')) || '',
  session: 'ios-' + (localStorage.getItem('ph:session') ||
                     Math.random().toString(36).slice(2, 10)),
};

/* ── debug strip (remove when stable) ── */
function dbg(msg) {
  let el = document.getElementById('dbg');
  if (!el) {
    el = document.createElement('div');
    el.id = 'dbg';
    el.style.cssText = 'position:fixed;top:2px;left:2px;right:2px;z-index:999;' +
      'font:9px/1.3 monospace;color:#9aa2b2;background:rgba(0,0,0,.6);' +
      'padding:2px 4px;max-height:60px;overflow-y:auto;word-break:break-all;';
    document.body.appendChild(el);
  }
  const line = document.createElement('div');
  line.textContent = new Date().toTimeString().slice(0,8) + ' ' + msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

const $ = (sel) => document.querySelector(sel);
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function setScreen(html, append = false) {
  const s = $('#screen');
  if (append) {
    const wrap = document.createElement('div');
    wrap.innerHTML = html;
    s.appendChild(wrap);
  } else {
    s.innerHTML = html;
  }
  // R-UI: innerHTML does NOT execute <script> tags. Re-create them so
  // generated screens run their JS (onclick attrs work natively).
  s.querySelectorAll('script').forEach(oldScript => {
    // H1 (P4 audit): never resurrect src-carrying scripts. Subresource loads
    // bypass the native nav allowlist; the prompt mandates inline JS (R-UI-5).
    if (oldScript.src) { dbg('blocked external script: ' + oldScript.src); return; }
    // M3 (P4 audit): preserve type (module/json data blocks)
    const s2 = document.createElement('script');
    if (oldScript.type) s2.type = oldScript.type;
    // M2 (P4 audit): IIFE-wrap so let/const can't collide across screens.
    // Top-level function declarations are hoisted to window so inline
    // onclick="name()" handlers keep working (they resolve at click time).
    const src = oldScript.textContent.replace(
      /(^|\n)(\s*)function\s+(\w+)\s*\(/g,
      '$1$2window.$3 = function(');
    s2.textContent = '(function(){\n' + src + '\n})();';
    oldScript.replaceWith(s2);  // L4: currentScript branch removed (dead+harmful)
  });
  s.scrollTop = s.scrollHeight;
}

function showThinking(on) {
  const old = document.getElementById('thinking');
  if (old) old.remove();
  if (on) {
    const el = document.createElement('div');
    el.className = 'thinking'; el.id = 'thinking';
    el.innerHTML = '<span class="ring"></span>THINKING <span class="dots"><span>·</span><span>·</span><span>·</span></span>';
    $('#screen').appendChild(el);
    $('#screen').scrollTop = $('#screen').scrollHeight;
  }
}

/* ── voice live bubble: partial transcript appears in the chat ── */
let liveBubble = null;
function voiceLive(text) {
  if (!text) { if (liveBubble) { liveBubble.remove(); liveBubble = null; } return; }
  if (!liveBubble) {
    liveBubble = document.createElement('div');
    liveBubble.className = 'voice-live';
    liveBubble.innerHTML = '<span></span>';
    $('#screen').appendChild(liveBubble);
  }
  liveBubble.querySelector('span').textContent = text;
  $('#screen').scrollTop = $('#screen').scrollHeight;
}

const state = { busy: false };

async function send(text) {
  dbg('send: ' + JSON.stringify(text));
  if (!text.trim() || state.busy) { dbg('send blocked (empty/busy)'); return; }
  state.busy = true;
  voiceLive(''); // clear any live bubble
  setScreen(`<div class="user-bubble"><span>${esc(text)}</span></div>`, true);
  showThinking(true);
  try {
    let data;
    const payload = { message: text, session: CONFIG.session };
    const handler = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.phosphorApi;
    if (handler) {
      // R-SEC-2: native proxy attaches the token; page never holds it.
      // M5 (audit): per-request id so a timed-out request's late reply
      // can never resolve a newer request.
      const reqId = 'r' + Date.now() + Math.random().toString(36).slice(2,7);
      data = await new Promise((resolve, reject) => {
        window.__phApiResolve = (id, d) => { if (id === reqId) resolve(d); };
        handler.postMessage(JSON.stringify({ ...payload, req: reqId }));
        setTimeout(() => { window.__phApiResolve = null; reject(new Error('native API timeout')); }, 120000);
      });
      if (data && data.__error) throw new Error(data.__error);
    } else {
      const res = await fetch(CONFIG.server + '/message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...payload, key: CONFIG.token }),
      });
      data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || ('HTTP ' + res.status));
    }
    if (!data.ok) throw new Error(data.error || 'server error');
    showThinking(false);
    dbg('reply ok, rounds=' + (data.meta ? data.meta.rounds : '?'));
    if (data.html) setScreen(data.html, true);
    else setScreen(`<div style="color:var(--fg); font-size:16px; padding:8px 4px;">${esc(data.text)}</div>`, true);
    // PHOS-SPEC-001 §8: native SwiftUI approval card (Captain decision)
    if (data.meta && data.meta.pending && window.webkit?.messageHandlers?.phosphorApproval) {
      const h = window.webkit.messageHandlers.phosphorApproval;
      h.postMessage({ approval_id: data.meta.pending.approval_id,
                      command: data.meta.pending.command });
      dbg('approval card requested: ' + data.meta.pending.approval_id.slice(0,8));
    }
  } catch (e) {
    showThinking(false);
    dbg('SEND FAILED: ' + (e.message || e));
    setScreen(`<div class="err-card">⚠ ${esc(e.message || e)}</div>`, true);
  } finally {
    state.busy = false;
  }
}

/* ── approval result from native card (PHOS-SPEC-001 §8) ── */
window.phosphor = window.phosphor || {};  // M1: init before use (works w/o userscript)
window.phosphor.approvalResult = function (approved, status, output) {
  dbg('approval: ' + status);
  setScreen(`<div style="color:${approved ? 'var(--accent)' : 'var(--fg-dim)'}; font-size:14px; padding:6px 4px;">${approved ? 'Approved' : 'Denied'} — ${esc(status)}${output ? '<br><span style="font-family:monospace; font-size:12px;">' + esc(output) + '</span>' : ''}</div>`, true);
};

/* ── native bridge: voice pipeline (mic toggle + partials + final) ── */
window.phosphor = window.phosphor || {};
window.phosphor.micToggle = function () {
  if (window.webkit?.messageHandlers?.phosphorMic) {
    window.webkit.messageHandlers.phosphorMic.postMessage({});
  } else {
    dbg('mic: native bridge unavailable (desktop)');
  }
};
window.phosphor.voicePreview = function (text) {
  if (Array.isArray(text)) text = text[0];
  text = String(text == null ? '' : text);
  if (text) voiceLive(text); else voiceLive('');
};
window.phosphor.voiceError = function (msg) {
  voiceLive('');
  setScreen(`<div class="err-card">⚠ ${esc(msg)}</div>`, true);
};
window.phosphor.voiceState = function (recording) {
  const mic = document.getElementById('mic');
  if (mic) mic.classList.toggle('recording', recording === true || recording === 'true');
};
window.phosphor.sendFromVoice = function (text) {
  if (Array.isArray(text)) text = text[0];
  text = String(text == null ? '' : text);
  voiceLive('');
  if (text.trim()) send(text.trim());
};
// scheme handoff for generated screens (tel:, sms:, mailto: handled natively
// via navigation policy; this helper opens via location for robustness)
window.phosphor.openURL = function (url) { location.href = url; };

/* ── settings (web form; on iOS a native screen owns config) ── */
function needsSetup() {
  // H1 (P3 audit): in the native app the token is invisible by design
  // (R-SEC-2); presence of the native API handler means we're configured.
  return !CONFIG.token && !(window.webkit?.messageHandlers?.phosphorApi);
}
function renderSetup() {
  const s = $('#screen');
  const native = !!window.webkit?.messageHandlers?.phosphorConfig;
  if (native) {
    s.innerHTML = `<div style="background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; margin-top:40px;">
      <div style="font-size:18px; font-weight:600; margin-bottom:6px;">No configuration</div>
      <div style="font-size:13px; color:var(--fg-dim);">Restart the app to enter settings.</div></div>`;
  } else {
    s.innerHTML = `
    <div style="background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; margin-top:40px;">
      <div style="font-size:18px; font-weight:600; margin-bottom:6px;">Connect to DragonCakes</div>
      <div style="font-size:13px; color:var(--fg-dim); margin-bottom:16px;">
        Server address + access token (desktop harness).
      </div>
      <input id="su-server" placeholder="http://192.168.x.x:8787" value="${esc(CONFIG.server)}"
             style="width:100%; margin-bottom:10px; padding:10px 14px; background:var(--card);
                    border:1px solid var(--line); border-radius:10px; color:var(--fg); font-size:15px;" />
      <input id="su-token" type="password" placeholder="access token (dcui_…)" value="${esc(CONFIG.token)}"
             style="width:100%; margin-bottom:16px; padding:10px 14px; background:var(--card);
                    border:1px solid var(--line); border-radius:10px; color:var(--fg); font-size:15px;" />
      <button id="su-save" style="background:var(--accent); border:none; border-radius:12px;
              padding:10px 22px; font-weight:600; cursor:pointer;">Save &amp; connect</button>
    </div>`;
    document.getElementById('su-save').onclick = () => {
      const isNative = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.phosphorConfig);
      localStorage.setItem('ph:server', document.getElementById('su-server').value.trim());
      // R-SEC-2: in the app the token is saved to native storage only
      // (phosphorConfig -> UserDefaults), never page-readable localStorage.
      if (!isNative) localStorage.setItem('ph:token', document.getElementById('su-token').value.trim());
      location.reload();
    };
  }
}

/* ── clear session ── */
async function clearSession() {
  dbg('clear session');
  try {
    const handler = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.phosphorApi;
    if (handler) {
      // M6 (audit): /reset must go through the native token proxy in-app
      await new Promise((resolve) => {
        window.__phApiResolve = (id, d) => resolve(d);
        handler.postMessage(JSON.stringify({ session: CONFIG.session, __reset: true, req: 'reset' }));
        setTimeout(resolve, 30000);
      });
    } else {
      await fetch(CONFIG.server + '/reset', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: CONFIG.token, session: CONFIG.session })
      });
    }
  } catch (e) { dbg('reset failed: ' + e.message); }
  setScreen('<div style="text-align:center; color:var(--fg-dim); margin-top:30vh;">session cleared</div>');
}

/* ── boot ── */
async function boot() {
  dbg('boot: server=' + CONFIG.server + ' tokenSet=' + !!CONFIG.token +
      ' native=' + (!!window.webkit?.messageHandlers?.phosphorMic));

  if (needsSetup()) {
    dbg('unconfigured');
    $('#splash').classList.add('hide');
    $('#splash').style.display = 'none';   // hard-remove: no stuck-overlay possible
    $('#app').classList.add('show');
    renderSetup();
    return;
  }

  try {
    setStatus('CONNECTING');
    dbg('health check...');
    const res = await fetch(CONFIG.server + '/health');
    if (!res.ok) throw new Error('bad status ' + res.status);
    const h = await res.json();
    if (!h.ok) throw new Error('unhealthy');
    dbg('health OK, model=' + (h.model || '?'));
  } catch (e) {
    dbg('health FAILED: ' + e.message);
    setStatus('SERVER UNREACHABLE');
    await new Promise(r => setTimeout(r, 1200));
    $('#splash').classList.add('hide');
    $('#splash').style.display = 'none';   // hard-remove
    $('#app').classList.add('show');
    renderSetup();
    return;
  }

  setStatus('READY');
  await new Promise(r => setTimeout(r, 450));
  const sp = $('#splash');
  sp.classList.add('hide');
  setTimeout(() => { sp.style.display = 'none'; }, 700);  // hard-remove after fade
  $('#app').classList.add('show');
  dbg('boot complete');
  setScreen('<div style="text-align:center; margin-top:30vh; color:var(--fg-dim); font-size:14px; letter-spacing:.2em;">PHOSPHOR READY<br><span style="font-size:11px;">tap the mic and speak</span></div>');
}

function setStatus(t) {
  const el = document.getElementById('boot-status');
  if (el) el.innerHTML = '<span class="ring"></span>' + t;
}

/* ── bindings ── */
$('#mic').onclick = () => {
  dbg('mic tapped');
  // optimistic visual toggle; native state push confirms/corrects
  $('#mic').classList.toggle('recording');
  window.phosphor.micToggle();
};
$('#clear').onclick = clearSession;
$('#settings').onclick = () => {
  dbg('settings tapped');
  if (window.webkit?.messageHandlers?.phosphorOpenSettings) {
    window.webkit.messageHandlers.phosphorOpenSettings.postMessage({});
  } else {
    renderSetup();
  }
};

boot();
</script>
</body>
</html>
