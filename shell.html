<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0a0e0a" />
<title>Phosphor</title>
<!--
  Phosphor · shell.html (chat mode)
  Chat log: your messages + agent replies stack newest-at-bottom.
  Agent HTML screens render inline as cards inside the log.
  Mic orb lives in a pinned bottom toolbar. Cancel (×) appears in the
  toolbar only while busy.
-->
<style>
  :root {
    --bg: #0a0e0a;
    --bg-soft: #111a11;
    --fg: #b6ffb6;
    --fg-dim: #5a8a5a;
    --accent: #7cffb2;
    --warn: #ffb86b;
    --err: #ff5e7c;
    --line: #1d2a1d;
    --mono: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--mono); overflow: hidden; -webkit-tap-highlight-color: transparent; }

  /* Status bar */
  #status { position: fixed; top: 0; left: 0; right: 0; height: 28px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-size: 11px; color: var(--fg-dim); z-index: 20; pointer-events: none; background: linear-gradient(to bottom, rgba(10,14,10,0.9), transparent); }
  #status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; margin-right: 6px; vertical-align: middle; }
  #status .dot.err { background: var(--err); }
  #status .right { display: flex; gap: 12px; }

  /* Chat scroll area */
  #chat { position: fixed; inset: 28px 0 100px 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 12px 20px; }
  .msg { margin: 8px 0; max-width: 88%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.45; word-wrap: break-word; }
  .msg.you { background: #16251a; border: 1px solid #24382a; margin-left: auto; color: #d9ffe9; }
  .msg.you .role { font-size: 9px; color: var(--fg-dim); letter-spacing: 0.2em; margin-bottom: 3px; }
  .msg.agent { background: var(--bg-soft); border: 1px solid var(--line); }
  .msg.agent .role { font-size: 9px; color: var(--fg-dim); letter-spacing: 0.2em; margin-bottom: 6px; }
  .msg.agent .card { color: var(--fg); font-size: 14px; }
  .msg.err { background: #2a1116; border: 1px solid var(--err); color: #ffc9d4; margin: 8px auto; max-width: 95%; }
  /* Agent-rendered HTML inherits card styles inside the log */
  .ph-card { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 10px 0; }
  .ph-row { display: flex; gap: 12px; align-items: center; padding: 12px; margin: 8px 0; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; min-height: 48px; }
  .ph-row:active { background: #182218; }
  .ph-btn { display: inline-block; padding: 12px 20px; background: var(--accent); color: #0a0e0a; border: none; border-radius: 12px; font-family: var(--mono); font-size: 14px; font-weight: 600; cursor: pointer; min-height: 44px; }
  .ph-btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .ph-h { font-size: 20px; margin: 8px 0 6px; color: var(--fg); font-weight: 500; }
  .ph-sub { font-size: 11px; color: var(--fg-dim); margin: 0 0 10px; letter-spacing: 0.1em; }
  .ph-input { width: 100%; padding: 12px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; color: var(--fg); font-family: var(--mono); font-size: 14px; min-height: 44px; }

  /* Pinned bottom toolbar */
  #toolbar { position: fixed; left: 0; right: 0; bottom: 0; height: 100px; background: var(--bg-soft); border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: center; gap: 16px; z-index: 30; }
  #mic { width: 80px; height: 80px; margin-top: -14px; border-radius: 50%; border: 2px solid var(--line); background: radial-gradient(circle at 50% 50%, var(--accent) 0%, rgba(124,255,178,0.06) 60%, transparent 75%); display: grid; place-items: center; cursor: pointer; transition: transform .15s, box-shadow .2s, background .2s; color: var(--accent); }
  #mic:active { transform: scale(0.95); }
  #mic.rec { background: var(--err); border-color: var(--err); color: #fff; box-shadow: 0 0 36px rgba(255,94,124,0.5); animation: pulse 1.4s ease-in-out infinite; }
  #mic.busy { border-color: var(--accent); animation: spin 1.6s linear infinite; }
  #mic svg { pointer-events: none; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  #txmode { position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.15em;
    padding: 8px 10px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg-dim); cursor: pointer; user-select: none; }
  #txmode.remote { color: var(--warn); border-color: var(--warn); }
  #cancel { width: 44px; height: 44px; border-radius: 50%; background: var(--err); color: #1a0a0a; border: none; font-family: var(--mono); font-size: 18px; cursor: pointer; display: none; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); }
  #cancel.show { display: grid; place-items: center; }

  /* Thinking indicator bubble */
  .msg.thinking { background: transparent; border: none; color: var(--fg-dim); font-size: 13px; }
  .msg.thinking .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
</style>
</head>
<body>

<div id="status">
  <div><span class="dot" id="dot"></span><span id="model-label">…</span></div>
  <div class="right"><span id="time">--:--</span></div>
</div>

<div id="chat"></div>

<div id="toolbar">
  <div id="txmode" role="button" aria-label="Toggle transcription mode">LOC</div>
  <button id="cancel" aria-label="Cancel">×</button>
  <div id="mic" role="button" aria-label="Tap to talk">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
    </svg>
  </div>
</div>

<script>
'use strict';
const CONFIG = { uiToken: "__UI_TOKEN__", model: "MiniMax-M3" };

// STT mode toggle: LOC = on-device whisper, CLD = remote (OpenRouter).
let txMode = localStorage.getItem("ph:txMode") || "local";
function setTxMode(m) {
  txMode = m;
  localStorage.setItem("ph:txMode", m);
  const pill = document.getElementById("txmode");
  pill.textContent = m === "remote" ? "CLD" : "LOC";
  pill.classList.toggle("remote", m === "remote");
}

const $ = (s) => document.querySelector(s);
const chat = $("#chat");

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function scrollBottom() { chat.scrollTop = chat.scrollHeight; }

function addYou(text) {
  const d = document.createElement("div");
  d.className = "msg you";
  d.innerHTML = `<div class="role">YOU</div>${escapeHtml(text)}`;
  chat.appendChild(d); scrollBottom();
}
function addAgentHTML(html) {
  const d = document.createElement("div");
  d.className = "msg agent";
  d.innerHTML = `<div class="role">PHOSPHOR</div><div class="card">${html}</div>`;
  chat.appendChild(d); scrollBottom();
}
function addAgentText(text) {
  const d = document.createElement("div");
  d.className = "msg agent";
  d.innerHTML = `<div class="role">PHOSPHOR</div><div class="card">${escapeHtml(text)}</div>`;
  chat.appendChild(d); scrollBottom();
}
function addError(text) {
  const d = document.createElement("div");
  d.className = "msg err";
  d.textContent = text;
  chat.appendChild(d); scrollBottom();
}
let thinkEl = null;
function showThinking(label) {
  clearThinking();
  thinkEl = document.createElement("div");
  thinkEl.className = "msg thinking";
  thinkEl.innerHTML = `${label}<span class="dots"></span>`;
  chat.appendChild(thinkEl); scrollBottom();
}
function clearThinking() { if (thinkEl) { thinkEl.remove(); thinkEl = null; } }

/* ── Status bar ── */
function tickClock() { $("#time").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
setInterval(tickClock, 30_000); tickClock();
$("#model-label").textContent = CONFIG.model;

/* ── Bridge (window.phosphor for agent screens) ── */
const BRIDGE_URL = "ws://127.0.0.1:7777/ws";
const DANGEROUS = ["tel.dial","sms.send","app.open","app.share","kv.set","clip.write","screen.idle","brightness"];
const unlocked = new Set();
let ws = null, wsReady = false, callCounter = 0;
const pending = new Map();

function connectBridge() {
  if (ws && ws.readyState <= 1) return;
  try { ws = new WebSocket(BRIDGE_URL); } catch { setTimeout(connectBridge, 2000); return; }
  ws.addEventListener("open", () => { wsReady = true; $("#dot").classList.remove("err"); });
  ws.addEventListener("close", () => { wsReady = false; $("#dot").classList.add("err"); setTimeout(connectBridge, 2000); });
  ws.addEventListener("error", () => { $("#dot").classList.add("err"); });
  ws.addEventListener("message", (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.id != null && pending.has(m.id)) {
      const { resolve, reject } = pending.get(m.id);
      pending.delete(m.id);
      m.error ? reject(new Error(m.error.message || "bridge error")) : resolve(m.result);
    }
  });
}
function bridgeCall(method, params = {}) {
  if (DANGEROUS.includes(method) && !unlocked.has(method)) {
    return Promise.resolve(confirmThen(method, params));
  }
  if (!wsReady) return Promise.resolve({ ok: true, stub: true });
  const id = `c${++callCounter}`;
  return new Promise((resolve, reject) => {
    pending.set(id, { resolve, reject });
    setTimeout(() => { if (pending.has(id)) { pending.delete(id); reject(new Error("bridge timeout")); } }, 30000);
    ws.send(JSON.stringify({ id, method, params }));
  });
}
function confirmThen(method, params) {
  const summary = escapeHtml(JSON.stringify(params)).slice(0, 200);
  addAgentHTML(`<div class="ph-h">Allow ${escapeHtml(method)}?</div>
    <pre style="font-size:11px;color:var(--fg-dim);white-space:pre-wrap">${summary}</pre>
    <button class="ph-btn" id="ph-a">Allow once</button>
    <button class="ph-btn ghost" id="ph-d" style="margin-left:8px">Deny</button>`);
  const card = chat.lastElementChild.querySelector(".card");
  card.querySelector("#ph-a").onclick = () => { unlocked.add(method); bridgeCall(method, params); };
  card.querySelector("#ph-d").onclick = () => { card.innerHTML = "Blocked."; };
}
connectBridge();

window.phosphor = {
  call: bridgeCall,
  ask(prompt) { addYou(prompt); agentTurn(prompt); },
  browse(url) {
    addAgentHTML(`<iframe src="${escapeHtml(url)}" style="width:100%;height:70vh;border:0;background:#000" sandbox="allow-scripts allow-forms"></iframe>`);
  },
  home() { unlocked.clear(); location.reload(); },
  triggerTurn(text) { addYou(text); agentTurn(text); },
};

/* ── The turn: STT already done; text goes to the runtime ── */
let abortCtrl = null;
async function agentTurn(userText) {
  abortCtrl = new AbortController();
  showThinking("thinking");
  $("#mic").classList.add("busy");
  $("#cancel").classList.add("show");
  try {
    const r = await fetch("/message", {
      method: "POST",
      signal: abortCtrl.signal,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: userText, key: CONFIG.uiToken, session: "shell" }),
    });
    if (!r.ok) throw new Error(`LLM ${r.status}: ${await r.text()}`);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "agent error");
    clearThinking();
    // Render exactly ONE answer: the screen if present, else the text.
    if (j.html) addAgentHTML(j.html);
    else if (j.text) addAgentText(j.text);
    else addAgentText("(no output)");
  } catch (err) {
    clearThinking();
    if (err.name !== "AbortError") addError(`Turn failed: ${err.message}`);
  } finally {
    $("#mic").classList.remove("busy");
    $("#cancel").classList.remove("show");
    abortCtrl = null;
  }
}

/* ── Voice capture ── */
const state = { listening: false, thinking: false, rec: null, chunks: [], stream: null };
const micBtn = $("#mic");

micBtn.addEventListener("click", async () => {
  if (state.listening) { stopRec(); return; }
  if (state.thinking) return;
  try {
    addLog("mic: requesting…");
    state.stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 }
    });
    addLog("mic: ok");
    state.chunks = [];
    state.rec = new MediaRecorder(state.stream, { mimeType: "audio/webm;codecs=opus" });
    state.rec.ondataavailable = (e) => { if (e.data.size) state.chunks.push(e.data); };
    state.rec.onstop = () => {
      state.stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(state.chunks, { type: "audio/webm" });
      addLog(`recording: ${blob.size} bytes -> transcribing`);
      transcribe(blob);
    };
    state.rec.start();
    state.listening = true;
    micBtn.classList.add("rec");
  } catch (err) {
    addError(`Mic failed: ${err.name} — ${err.message}. ` +
      "Fix: Settings → Apps → Vanadium → Permissions → Microphone → Allow");
  }
});

function stopRec() {
  state.listening = false;
  micBtn.classList.remove("rec");
  state.rec?.stop();
}

function addLog(msg) { console.log("[phosphor]", msg); }

async function transcribe(blob) {
  state.thinking = true;
  micBtn.classList.add("busy");
  showThinking("transcribing");
  try {
    const r = await fetch(`/transcribe?key=${encodeURIComponent(CONFIG.uiToken)}&mode=${txMode}`, {
      method: "POST",
      headers: { "Content-Type": "application/octet-stream" },
      body: blob,
    });
    if (!r.ok) throw new Error(`STT ${r.status}: ${await r.text()}`);
    const j = await r.json();
    if (j.note) addError(j.note);
    const text = (j.text || "").trim();
    if (!text) { addAgentText("(heard nothing)"); return; }
    addYou(text);
    await agentTurn(text);
  } catch (err) {
    addError(`STT failed: ${err.message}`);
  } finally {
    state.thinking = false;
    micBtn.classList.remove("busy");
    clearThinking();
  }
}

document.getElementById("txmode").addEventListener("click", () => {
  setTxMode(txMode === "local" ? "remote" : "local");
});
setTxMode(txMode);

$("#cancel").addEventListener("click", () => {
  abortCtrl?.abort();
  state.thinking = false;
  micBtn.classList.remove("busy");
  $("#cancel").classList.remove("show");
  clearThinking();
});
</script>
</body>
</html>
